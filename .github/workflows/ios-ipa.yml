name: Build VibeChat IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp -R index.html www/
          cp -R css www/
          cp -R js www/
          cp -R icons www/
          cp -R manifest.json www/ 2>/dev/null || true
          cp -R firebase-messaging-sw.js www/ 2>/dev/null || true
          echo "Contents of www:"
          find www -maxdepth 2 -type f | sort

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VibeChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/VibeChat.xcarchive/Products/Applications/App.app" Payload/VibeChat.app
          zip -r VibeChat-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeChat-IPA
          path: VibeChat-unsigned.ipa
