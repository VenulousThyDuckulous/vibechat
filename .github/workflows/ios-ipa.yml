name: Build VibeChat IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VibeChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/VibeChat.xcarchive/Products/Applications/App.app" Payload/VibeChat.app
          zip -r VibeChat-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VibeChat-IPA
          path: VibeChat-unsigned.ipa
